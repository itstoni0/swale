name: ci

# This workflow runs on a pull request.
# This workflow runs on a push to main.
# A feature-branch push does not start a second run.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)" || exit 1
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
